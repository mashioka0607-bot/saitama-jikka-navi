name: SEO quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build deploy artifact and run crawl/index checks
        run: python deploy.py
      - name: Show generated discovery files
        run: |
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/google02c383ec58048d5e.html
          grep -q 'sitemap.xml' dist/robots.txt
          grep -q 'kawagoe-shi/katazuke-hiyou-urenai' dist/sitemap.xml
      - name: Guard homepage positioning
        run: |
          test -f dist/index.html
          grep -q '埼玉' dist/index.html
          if grep -q 'Kawagoe / Inherited Home' dist/index.html; then
            echo 'Homepage is still positioned as Kawagoe-only; migrate it to the Saitama-wide decision hub.'
            exit 1
          fi
