name: SEO quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build deploy artifact and run crawl/index checks
        run: python deploy.py
      - name: Validate grant selector JavaScript syntax
        run: node --check static_pages/kaitai-check/grants.js
      - name: Test Japan-time grant deadline warnings
        run: node tests/test_grant_deadline_guard.js
      - name: Validate diagnosis decisions by user intent
        run: node tests/test_diagnosis_routing.js
      - name: Validate low-price brokerage fee scenario and limit
        run: node tests/test_low_price_broker.js
      - name: Run affiliate and GA4 regression tests
        run: python -m unittest discover -s tests -p 'test_affiliate_quality_gate.py' -v
      - name: Verify Search Console CSV audit (offline fixtures)
        run: python -m unittest discover -s tests -p 'test_gsc_audit.py' -v
      - name: Guard disclosure of illustrative prices on the take-home calculator
        run: |
          grep -q 'id="sample-value-disclosure"' dist/tedori-hikaku/index.html
          grep -q '仮の数値' dist/tedori-hikaku/index.html
          grep -q 'https://www.pref.saitama.lg.jp/a1106/akiyakanrisyatouroku.html' dist/tedori-hikaku/index.html
      - name: Show generated discovery files
        run: |
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/google02c383ec58048d5e.html
          grep -q 'sitemap.xml' dist/robots.txt
          grep -q 'kawagoe-shi/katazuke-hiyou-urenai' dist/sitemap.xml
      - name: Guard statewide FAQ and high-intent next steps
        run: |
          test -f dist/faq/index.html
          grep -q 'href="/tedori-hikaku/"' dist/faq/index.html
          grep -q 'https://www.pref.saitama.lg.jp/a1106/akiyakanrisyatouroku.html' dist/faq/index.html
          if grep -q '川越市は空き家管理について' dist/faq/index.html; then
            echo 'Statewide FAQ must not present Kawagoe-only services as a default.'
            exit 1
          fi
      - name: Guard homepage positioning
        run: |
          test -f dist/index.html
          grep -q '埼玉' dist/index.html
          grep -q 'すでに売却を検討中の方は' dist/index.html
          grep -q 'href="/tedori-hikaku/"' dist/index.html
          if grep -q 'Kawagoe / Inherited Home' dist/index.html; then
            echo 'Homepage is still positioned as Kawagoe-only; migrate it to the Saitama-wide decision hub.'
            exit 1
          fi

      - name: Check production smoke script syntax
        run: python -m py_compile scripts/check_live_site.py
      - name: Check public Cloudflare URL after main push (informational)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: python scripts/check_live_site.py
